<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" aria-labelledby="title description" role="img" viewBox="0 0 1000 800"><title id="title">Choose the model, then schedule the inference</title><desc id="description">An agent sends a request through an AI gateway. Semantic Router combines request signals and conversation context to admit model B. The inference router picks B1 within model B&apos;s pool. Each replica has its own KV cache. Model A is not admitted for this request.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path fill="#64748b" d="M0 0 L8 4 L0 8"/></marker><marker id="teal-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="#16836c" d="M0 0 L8 4 L0 8"/></marker><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#162238}.heading{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:19px;fill:#344257}.small{font-size:17px;fill:#526074}.panel{fill:#f4f6f9;stroke:#c3cbd5;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.selected-line{fill:none;stroke:#16836c;stroke-width:3;marker-end:url(#teal-arrow)}</style></defs><rect width="1000" height="800" fill="#fff" rx="24"/><text x="40" y="54" class="heading">Choose the model. Then schedule the inference.</text><text x="40" y="88" class="body">One request · two decisions · a shared eligibility boundary</text><rect width="190" height="100" x="40" y="138" class="panel" rx="16"/><text x="62" y="179" class="label">Agent / client</text><text x="62" y="210" class="body">History + tools</text><rect width="240" height="100" x="260" y="138" class="panel" rx="16"/><text x="283" y="179" class="label">AI gateway</text><text x="283" y="210" class="body">Identity + policy</text><rect width="420" height="120" x="540" y="128" fill="#f0ebfa" stroke="#7654bd" stroke-width="2" rx="16"/><text x="563" y="168" class="label">1 · Semantic Router</text><text x="563" y="201" class="body">Request meaning + continuity rules</text><text x="563" y="230" fill="#6444a0" font-size="19">Eligible logical model: B</text><path d="M230 188 H250" class="line"/><path d="M500 188 H530" class="line"/><rect width="440" height="108" x="40" y="296" class="panel" rx="16"/><text x="63" y="333" class="label">Conversation context</text><text x="63" y="365" class="body">Current owner · tool phase · outcomes</text><text x="63" y="391" class="small">Available cache evidence informs switch cost</text><path fill="none" stroke="#7654bd" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#arrow)" d="M480 350 H518 V228 H530"/><rect width="420" height="108" x="540" y="296" fill="#e9f6f1" stroke="#16836c" stroke-width="2" rx="16"/><text x="563" y="334" class="label">2 · Inference router</text><text x="563" y="366" class="body">Health + load + available cache signals</text><text x="563" y="392" class="small">Select an endpoint inside the admitted pool</text><path d="M750 248 V286" class="selected-line"/><path d="M750 404 V443" class="selected-line"/><rect width="440" height="212" x="40" y="454" fill="#f9fafb" stroke="#c3cbd5" stroke-dasharray="6 5" rx="18"/><text x="63" y="493" class="label">Model A pool</text><text x="305" y="491" class="small">Not admitted</text><rect width="188" height="119" x="63" y="518" class="panel" rx="12"/><text x="83" y="551" class="body">Replica A1</text><rect width="150" height="42" x="82" y="570" fill="#e5eaf0" rx="8"/><text x="99" y="597" class="small">A1&apos;s KV cache</text><rect width="184" height="119" x="272" y="518" class="panel" rx="12"/><text x="292" y="551" class="body">Replica A2</text><rect width="148" height="42" x="290" y="570" fill="#e5eaf0" rx="8"/><text x="306" y="597" class="small">A2&apos;s KV cache</text><rect width="440" height="212" x="520" y="454" fill="#f0faf5" stroke="#16836c" stroke-width="2" rx="18"/><text x="543" y="493" class="label">Model B pool</text><text x="782" y="491" fill="#116b58" font-size="17">Admitted pool</text><rect width="188" height="119" x="543" y="518" fill="#ddf3e9" stroke="#16836c" stroke-width="2" rx="12"/><text x="563" y="551" class="body">B1 · selected</text><rect width="150" height="42" x="562" y="570" fill="#c8eadd" rx="8"/><text x="578" y="597" fill="#116b58" font-size="17">B1&apos;s KV cache</text><rect width="184" height="119" x="752" y="518" class="panel" rx="12"/><text x="772" y="551" class="body">Replica B2</text><rect width="148" height="42" x="770" y="570" fill="#e5eaf0" rx="8"/><text x="786" y="597" class="small">B2&apos;s KV cache</text><path fill="none" stroke="#16836c" stroke-width="2.5" d="M750 459 V508 H637 V518"/><rect width="920" height="70" x="40" y="697" fill="#f1f5f9" rx="12"/><text x="62" y="725" class="body">The transcript can travel. Model A&apos;s KV cache does not become model B&apos;s cache.</text><text x="62" y="751" class="small">Logical layers may share a gateway process. Cache transfer requires explicit serving support.</text></svg>