<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" aria-labelledby="title description" role="img" viewBox="0 0 1000 640"><title id="title">A model switch does not repair the transcript</title><desc id="description">The observed failure schedule uses the small model for turns one to three, followed by the strong model for turns four to six. Turn three fails and remains in the history. Three of sixteen sustained-regression sessions fail the final check. A proposed, unevaluated recovery path verifies or repairs the failed step before continuing.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="#64748b" d="M0 0 L8 4 L0 8"/></marker><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#162238}.heading{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px;fill:#344257}.small{font-size:17px;fill:#526074}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1000" height="640" fill="#fff" rx="24"/><text x="40" y="54" class="heading">A model switch does not repair the transcript.</text><text x="40" y="87" class="body">Observed late escalation · six turns · the complete history travels forward</text><text x="96" y="138" class="small">TURN 1</text><text x="247" y="138" class="small">TURN 2</text><text x="398" y="138" class="small">TURN 3</text><text x="549" y="138" class="small">TURN 4</text><text x="700" y="138" class="small">TURN 5</text><text x="851" y="138" class="small">TURN 6</text><rect width="135" height="90" x="63" y="159" fill="#f4f6f9" stroke="#c3cbd5" rx="13"/><text x="91" y="195" class="label">Small</text><text x="90" y="224" class="small">Store state</text><rect width="135" height="90" x="214" y="159" fill="#f4f6f9" stroke="#c3cbd5" rx="13"/><text x="242" y="195" class="label">Small</text><text x="239" y="224" class="small">Recall state</text><rect width="135" height="90" x="365" y="159" fill="#fff1ec" stroke="#b44c39" stroke-width="2" rx="13"/><text x="393" y="195" class="label">Small</text><text x="388" y="224" fill="#9b3b2c" font-size="17">Failed step</text><rect width="135" height="90" x="516" y="159" fill="#f0ebfa" stroke="#7654bd" rx="13"/><text x="539" y="195" class="label">Strong</text><text x="536" y="224" class="small">Escalation</text><rect width="135" height="90" x="667" y="159" fill="#f0ebfa" stroke="#7654bd" rx="13"/><text x="690" y="195" class="label">Strong</text><text x="693" y="224" class="small">Continue</text><rect width="135" height="90" x="818" y="159" fill="#f0ebfa" stroke="#7654bd" rx="13"/><text x="841" y="195" class="label">Strong</text><text x="834" y="224" class="small">Final check</text><path d="M198 204 H205" class="line"/><path d="M349 204 H356" class="line"/><path d="M500 204 H507" class="line"/><path d="M651 204 H658" class="line"/><path d="M802 204 H809" class="line"/><path fill="none" stroke="#b44c39" stroke-width="2.5" d="M432 249 V278 H885 V250"/><text x="470" y="304" fill="#9b3b2c" font-size="19">Earlier incorrect answer remains in the context</text><rect width="920" height="57" x="40" y="331" fill="#fff3ef" rx="12"/><text x="61" y="366" class="body">3 of 16 state-retention sessions failed final synthesis after this late switch.</text><text x="40" y="437" class="label">Design alternative: recover the failed state before continuing</text><text x="40" y="465" class="small">Proposed strategy · not evaluated in this benchmark</text><rect width="245" height="82" x="40" y="489" fill="#f4f6f9" stroke="#c3cbd5" rx="13"/><text x="63" y="523" class="body">Identify the failed step</text><text x="63" y="550" class="small">Outcome + source inputs</text><rect width="300" height="82" x="352" y="489" fill="#e9f6f1" stroke="#16836c" rx="13"/><text x="376" y="523" class="body">Verify, repair, or safely replay</text><text x="376" y="550" class="small">Handle tool side effects explicitly</text><rect width="241" height="82" x="719" y="489" fill="#f0ebfa" stroke="#7654bd" rx="13"/><text x="742" y="523" class="body">Continue on strong</text><text x="742" y="550" class="small">With verified task state</text><path d="M285 530 H342" class="line"/><path d="M652 530 H709" class="line"/><text x="40" y="611" class="small">Transcript portability, task correctness, and KV-cache reuse are separate properties.</text></svg>