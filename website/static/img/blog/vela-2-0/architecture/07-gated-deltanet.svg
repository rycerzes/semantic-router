<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" role="img" viewBox="0 0 1600 1840"><title>Vela 2.0 Gated-DeltaNet: exact operator detail</title><desc>Bottom-to-top activation flow: pre-normalized hidden states; fused QKV projection, causal depthwise convolution and SiLU, Q/K head repetition and L2 normalization, chunk gated delta update with independent prefix state, per-value-head RMSNorm before SiLU output gating, and output projection. The three model sizes have independent parameters.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.math{font-style:italic}.math,.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="480" y="120" class="math" font-size="27" text-anchor="middle">Mixer output · L × d</text><g data-box="285.0 165 390 68"><rect width="390" height="68" x="285" y="165" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="480" y="207.84" font-size="26" text-anchor="middle">Output Linear: Dv → d</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M480,165 L480,135"/><g data-box="285.0 305 390 64"><rect width="390" height="64" x="285" y="305" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="480" y="345.84" font-size="26" text-anchor="middle">Concatenate V heads</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M480,305 L480,233"/><circle cx="480" cy="425" r="21" fill="#FFF" stroke="#111" stroke-width="2.1"/><text x="480" y="434.61" font-size="31" text-anchor="middle">⊙</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M480,404 L480,369"/><g data-box="285.0 505 390 65"><rect width="390" height="65" x="285" y="505" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="480" y="546.34" font-size="26" text-anchor="middle">RMSNorm: 128 / V head</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M480,505 L480,446"/><g data-box="150.0 635 660 116"><rect width="660" height="116" x="150" y="635" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="480" y="672.25" font-size="25" text-anchor="middle">Chunk Gated Delta Rule</text><text x="480" y="701.5" font-size="25" text-anchor="middle">decay g · update β</text><text x="480" y="730.75" font-size="25" text-anchor="middle">prefix: S₀ = 0; question: S₀ = Sₚ</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M480,635 L480,570"/><text x="1180" y="122" font-size="27" text-anchor="middle">Per-head Delta state</text><text x="1180" y="165" class="math" font-size="27" text-anchor="middle">Dₜ = exp(gₜ) Sₜ₋₁</text><text x="1180" y="196.59" class="math" font-size="27" text-anchor="middle">δₜ = βₜ (vₜ − Dₜᵀ kₜ)</text><text x="1180" y="228.18" class="math" font-size="27" text-anchor="middle">Sₜ = Dₜ + kₜ δₜᵀ</text><text x="1180" y="259.77" class="math" font-size="27" text-anchor="middle">oₜ = Sₜᵀ q̄ₜ</text><text x="1180" y="315" class="math" font-size="25" text-anchor="middle">q̄ = L2Norm(q) / √128</text><text x="1180" y="350" font-size="25" text-anchor="middle">State per V head: 128 × 128</text><text x="1180" y="385" font-size="24" text-anchor="middle">Prefix starts at zero; questions fork Sₚ</text><g data-box="110.0 1270 440 82"><rect width="440" height="82" x="110" y="1270" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="330" y="1304.63" font-size="26" text-anchor="middle">Fused QKV Linear</text><text x="330" y="1335.05" font-size="26" text-anchor="middle">d → 2Dk + Dv</text></g><g data-box="75.0 1145 510 84"><rect width="510" height="84" x="75" y="1145" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="330" y="1180.875" font-size="25" text-anchor="middle">Causal depthwise Conv1D</text><text x="330" y="1210.125" font-size="25" text-anchor="middle">k = 4 · prefix tail + own block</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M330,1270 L330,1229"/><g data-box="185.0 1048 290 58"><rect width="290" height="58" x="185" y="1048" fill="#DED2EC" stroke="#111" stroke-width="2.2" rx="7"/><text x="330" y="1086.18" font-size="27" text-anchor="middle">SiLU</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M330,1145 L330,1106"/><g data-box="75.0 945 510 65"><rect width="510" height="65" x="75" y="945" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="330" y="986" font-size="25" text-anchor="middle">Split Q / K / V into heads</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M330,1048 L330,1010"/><g data-box="72.5 870 345 58"><rect width="345" height="58" x="72.5" y="870" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="245" y="907.16" font-size="24" text-anchor="middle">Repeat Q/K heads 1× or 2×</text></g><g data-box="80.0 770 330 80"><rect width="330" height="80" x="80" y="770" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="245" y="803.875" font-size="25" text-anchor="middle">L2Norm(Q, K)</text><text x="245" y="833.125" font-size="25" text-anchor="middle">Q scale: 1 / √128</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M245,945 L245,928"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M510,945 L510,780 L630,780 L630,751"/><text x="542" y="858" class="math" font-size="26" text-anchor="middle">V</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M245,870 L245,850"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M245,770 L245,751"/><g data-box="655.0 1270 290 82"><rect width="290" height="82" x="655" y="1270" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="800" y="1319.84" font-size="26" text-anchor="middle">Linear a: d → hv</text></g><circle cx="800" cy="1214" r="20" fill="#FFF" stroke="#111" stroke-width="2.1"/><text x="800" y="1223.3" font-size="30" text-anchor="middle">+</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M800,1270 L800,1234"/><g data-box="600.0 1182 160 63"><rect width="160" height="63" x="600" y="1182" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="680" y="1222" font-size="25" text-anchor="middle">dt bias</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M760,1214 L780,1214"/><g data-box="655.0 1085 290 65"><rect width="290" height="65" x="655" y="1085" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="800" y="1126.34" font-size="26" text-anchor="middle">Softplus</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M800,1194 L800,1150"/><circle cx="800" cy="1007" r="20" fill="#FFF" stroke="#111" stroke-width="2.1"/><text x="800" y="1016.3" font-size="30" text-anchor="middle">⊙</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M800,1085 L800,1027"/><g data-box="895.0 975 280 64"><rect width="280" height="64" x="895" y="975" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1035" y="1015.84" font-size="26" text-anchor="middle">−exp(A log)</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M895,1007 L820,1007"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M800,987 L850,987 L850,725 L810,725"/><text x="884" y="825" class="math" font-size="27" text-anchor="middle">g</text><g data-box="977.5 1270 285 82"><rect width="285" height="82" x="977.5" y="1270" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1120" y="1319.84" font-size="26" text-anchor="middle">Linear b: d → hv</text></g><g data-box="997.5 1135 245 66"><rect width="245" height="66" x="997.5" y="1135" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1120" y="1176.84" font-size="26" text-anchor="middle">Sigmoid</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1120,1270 L1120,1201"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1120,1135 L1120,1095 L1238,1095 L1238,681 L810,681"/><text x="1270" y="860" class="math" font-size="27" text-anchor="middle">β</text><g data-box="1295.0 1270 270 82"><rect width="270" height="82" x="1295" y="1270" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="1319.84" font-size="26" text-anchor="middle">Linear z: d → Dv</text></g><g data-box="1302.5 1090 255 66"><rect width="255" height="66" x="1302.5" y="1090" fill="#DED2EC" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="1132.18" font-size="27" text-anchor="middle">SiLU(z)</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,1270 L1430,1156"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,1090 L1430,425 L501,425"/><text x="1458" y="845" font-size="25" text-anchor="start">z gate</text><g data-box="235.0 1450 1130 70"><rect width="1130" height="70" x="235" y="1450" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="800" y="1494.18" font-size="27" text-anchor="middle">H = RMSNorm(X) · L × d</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M800,1450 L800,1390"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M330,1390 L1430,1390"/><circle cx="800" cy="1390" r="3.5" fill="#111"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M330,1390 L330,1352"/><circle cx="330" cy="1390" r="3.5" fill="#111"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M800,1390 L800,1352"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1120,1390 L1120,1352"/><circle cx="1120" cy="1390" r="3.5" fill="#111"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,1390 L1430,1352"/><circle cx="1430" cy="1390" r="3.5" fill="#111"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M70,1542 L1530,1542"/><text x="160" y="1570" font-size="25" text-anchor="middle">Model</text><text x="430" y="1570" font-size="25" text-anchor="middle">d</text><text x="740" y="1570" font-size="25" text-anchor="middle">Q/K heads / V heads</text><text x="1115" y="1570" font-size="25" text-anchor="middle">Q/K repetition</text><text x="1420" y="1570" font-size="25" text-anchor="middle">Dv</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="M70,1585 L1530,1585"/><text x="160" y="1623" font-size="25" text-anchor="middle">0.8B</text><text x="430" y="1623" font-size="25" text-anchor="middle">1024</text><text x="740" y="1623" font-size="25" text-anchor="middle">16 / 16</text><text x="1115" y="1623" font-size="25" text-anchor="middle">1×</text><text x="1420" y="1623" font-size="25" text-anchor="middle">2048</text><text x="160" y="1661" font-size="25" text-anchor="middle">4B</text><text x="430" y="1661" font-size="25" text-anchor="middle">2560</text><text x="740" y="1661" font-size="25" text-anchor="middle">16 / 32</text><text x="1115" y="1661" font-size="25" text-anchor="middle">2×</text><text x="1420" y="1661" font-size="25" text-anchor="middle">4096</text><text x="160" y="1699" font-size="25" text-anchor="middle">9B</text><text x="430" y="1699" font-size="25" text-anchor="middle">4096</text><text x="740" y="1699" font-size="25" text-anchor="middle">16 / 32</text><text x="1115" y="1699" font-size="25" text-anchor="middle">2×</text><text x="1420" y="1699" font-size="25" text-anchor="middle">4096</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M70,1715 L1530,1715"/><text x="800" y="1747" font-size="24" text-anchor="middle">Dk = 2048; dk = dv = 128. Independent checkpoints; shared operator topology.</text><text x="800" y="1800" class="serif" font-size="31" text-anchor="middle">(g) Gated-DeltaNet: convolution, delta update and gated readout</text></svg>