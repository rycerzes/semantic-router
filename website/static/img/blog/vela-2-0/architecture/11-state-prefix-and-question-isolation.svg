<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1190" role="img" viewBox="0 0 1500 1190"><title>Vela 2.0 hybrid models: state-prefix and question isolation</title><desc>Runtime tree forward for 0.8B, 4B, and 9B. Activation and cache flow run upward.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="280" y="68" font-size="27" text-anchor="middle">Decision logits</text><g data-box="95.0 112 370 80"><rect width="370" height="80" x="95" y="112" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="280" y="146.12" font-size="24" text-anchor="middle">Choice / Noul / Score readout</text><text x="280" y="174.2" font-size="24" text-anchor="middle">from final-normalized states</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M280,111 L280,83"/><g data-box="95.0 245 370 88"><rect width="370" height="88" x="95" y="245" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="280" y="283.12" font-size="24" text-anchor="middle">Continue own question block</text><text x="280" y="311.2" font-size="24" text-anchor="middle">through every backbone layer</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M280,244 L280,193"/><g data-box="95.0 390 370 80"><rect width="370" height="80" x="95" y="390" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="280" y="424.365" font-size="23" text-anchor="middle">Own block tokens</text><text x="280" y="451.275" font-size="23" text-anchor="middle">position starts after the prefix</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M280,389 L280,334"/><text x="750" y="68" font-size="27" text-anchor="middle">Word × label logits</text><g data-box="565.0 112 370 80"><rect width="370" height="80" x="565" y="112" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="750" y="146.12" font-size="24" text-anchor="middle">Span readout</text><text x="750" y="174.2" font-size="24" text-anchor="middle">from final-normalized states</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,111 L750,83"/><g data-box="565.0 245 370 88"><rect width="370" height="88" x="565" y="245" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="750" y="283.12" font-size="24" text-anchor="middle">Continue own question block</text><text x="750" y="311.2" font-size="24" text-anchor="middle">through every backbone layer</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,244 L750,193"/><g data-box="565.0 390 370 80"><rect width="370" height="80" x="565" y="390" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="750" y="424.365" font-size="23" text-anchor="middle">Own block tokens</text><text x="750" y="451.275" font-size="23" text-anchor="middle">position starts after the prefix</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,389 L750,334"/><text x="1220" y="68" font-size="27" text-anchor="middle">Decision logits</text><g data-box="1035.0 112 370 80"><rect width="370" height="80" x="1035" y="112" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1220" y="146.12" font-size="24" text-anchor="middle">Set readout</text><text x="1220" y="174.2" font-size="24" text-anchor="middle">from final-normalized states</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1220,111 L1220,83"/><g data-box="1035.0 245 370 88"><rect width="370" height="88" x="1035" y="245" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1220" y="283.12" font-size="24" text-anchor="middle">Continue own question block</text><text x="1220" y="311.2" font-size="24" text-anchor="middle">through every backbone layer</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1220,244 L1220,193"/><g data-box="1035.0 390 370 80"><rect width="370" height="80" x="1035" y="390" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="1220" y="424.365" font-size="23" text-anchor="middle">Own block tokens</text><text x="1220" y="451.275" font-size="23" text-anchor="middle">position starts after the prefix</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1220,389 L1220,334"/><g data-box="380.0 620 740 88"><rect width="740" height="88" x="380" y="620" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="750" y="657.875" font-size="25" text-anchor="middle">Shared state-prefix pass</text><text x="750" y="687.125" font-size="25" text-anchor="middle">F layers: KV; L layers: state + conv tail</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,619 L750,550 L68,550 L68,289 L94,289"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,619 L750,550 L538,550 L538,289 L564,289"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,619 L750,550 L1008,550 L1008,289 L1034,289"/><circle cx="750" cy="550" r="3.5" fill="#111"/><text x="715" y="586" font-size="23" text-anchor="end">Independent prefix forks</text><g data-box="380.0 780 740 88"><rect width="740" height="88" x="380" y="780" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="750" y="817.875" font-size="25" text-anchor="middle">Typed state: request / context / answer</text><text x="750" y="847.125" font-size="25" text-anchor="middle">role-tagged text → prefix token embeddings</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,779 L750,709"/><text x="750" y="929" font-size="27" text-anchor="middle">Runtime request: one state and multiple questions</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M750,902 L750,869"/><text x="280" y="512" font-size="24" text-anchor="middle">Question 1</text><text x="750" y="512" font-size="24" text-anchor="middle">Question 2</text><text x="1220" y="512" font-size="24" text-anchor="middle">Question 3</text><text x="750" y="1011" font-size="23" text-anchor="middle">For a fixed rendered state, each question sees its prefix and its own causal block.</text><text x="750" y="1037.91" font-size="23" text-anchor="middle">Each extra span question uses another rendered sequence.</text><text x="750" y="1064.82" font-size="23" text-anchor="middle">Span targets &gt; 2,048 tokens: 1,800-token windows, stride 1,536; mean word logits.</text><text x="750" y="1144" class="serif" font-size="31" text-anchor="middle">State sharing and isolated question continuations</text></svg>