<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1570" role="img" viewBox="0 0 1240 1570"><title>Vela 2.0 9B: model architecture</title><desc>Verified inference graph. Read bottom to top. Independent checkpoint.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.math{font-style:italic}.math,.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="320" y="58" font-size="28" text-anchor="middle">Decision outputs</text><text x="920" y="58" font-size="28" text-anchor="middle">Labeled text spans</text><g data-box="90.0 100 460 88"><rect width="460" height="88" x="90" y="100" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="320" y="138.12" font-size="24" text-anchor="middle">Calibration + softmax / sigmoid</text><text x="320" y="166.2" font-size="24" text-anchor="middle">Choice · Noul · Score · Set</text></g><g data-box="690.0 100 460 88"><rect width="460" height="88" x="690" y="100" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="920" y="138.12" font-size="24" text-anchor="middle">Sigmoid + threshold + merge</text><text x="920" y="166.2" font-size="24" text-anchor="middle">Unicode character offsets</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M320,99 L320,72"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M920,99 L920,72"/><g data-box="90.0 235 460 86"><rect width="460" height="86" x="90" y="235" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="320" y="272.12" font-size="24" text-anchor="middle">CandidateHead: LayerNorm</text><text x="320" y="300.2" font-size="24" text-anchor="middle">scaled bilinear + GELU MLP</text></g><g data-box="90.0 370 460 86"><rect width="460" height="86" x="90" y="370" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="320" y="407.12" font-size="24" text-anchor="middle">Option endpoint states</text><text x="320" y="435.2" font-size="24" text-anchor="middle">+ question-block endpoint</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M320,234 L320,189"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M320,369 L320,322"/><g data-box="690.0 235 460 86"><rect width="460" height="86" x="690" y="235" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="920" y="272.12" font-size="24" text-anchor="middle">SpanHeadV2: router OR broad</text><text x="920" y="300.2" font-size="24" text-anchor="middle">separate weights; same topology</text></g><g data-box="690.0 370 460 86"><rect width="460" height="86" x="690" y="370" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="920" y="407.12" font-size="24" text-anchor="middle">Repeated target: first sub-tokens</text><text x="920" y="435.2" font-size="24" text-anchor="middle">+ label-block mean states</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M920,234 L920,189"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M920,369 L920,322"/><g data-box="445.0 530 350 54"><rect width="350" height="54" x="445" y="530" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="565.84" font-size="26" text-anchor="middle">Final RMSNorm</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,529 L620,492 L320,492 L320,457"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,492 L920,492 L920,457"/><circle cx="620" cy="492" r="3.5" fill="#111"/><text x="620" y="480" class="math" font-size="22" text-anchor="middle">H: sequence length × 4,096</text><rect width="568" height="595" x="338" y="625" fill="#F4F4F4" stroke="#111" stroke-width="2.2" rx="23"/><text x="314" y="931.5" class="math" font-size="30" text-anchor="end">32×</text><circle cx="620" cy="675" r="18" fill="#FFF" stroke="#111" stroke-width="2.1"/><text x="620" y="683.99" font-size="29" text-anchor="middle">+</text><g data-box="445.0 723 350 80"><rect width="350" height="80" x="445" y="723" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="756.875" font-size="25" text-anchor="middle">SwiGLU feed forward</text><text x="620" y="786.125" font-size="25" text-anchor="middle">4,096 → 12,288 → 4,096</text></g><g data-box="445.0 841 350 50"><rect width="350" height="50" x="445" y="841" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="874.5" font-size="25" text-anchor="middle">RMSNorm</text></g><circle cx="620" cy="935" r="18" fill="#FFF" stroke="#111" stroke-width="2.1"/><text x="620" y="943.99" font-size="29" text-anchor="middle">+</text><g data-box="445.0 983 350 85"><rect width="350" height="85" x="445" y="983" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="1019.62" font-size="24" text-anchor="middle">Gated-DeltaNet (L)</text><text x="620" y="1047.7" font-size="24" text-anchor="middle">or gated causal GQA (F)</text></g><g data-box="445.0 1106 350 50"><rect width="350" height="50" x="445" y="1106" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="1139.5" font-size="25" text-anchor="middle">RMSNorm</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,656 L620,585"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,722 L620,694"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,840 L620,804"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,916 L620,892"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,982 L620,954"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,1105 L620,1069"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,1188 L859,1188 L859,935 L639,935"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,907 L859,907 L859,675 L639,675"/><circle cx="620" cy="1188" r="3.5" fill="#111"/><circle cx="620" cy="907" r="3.5" fill="#111"/><g data-box="445.0 1280 350 74"><rect width="350" height="74" x="445" y="1280" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="620" y="1310.875" font-size="25" text-anchor="middle">Token embedding</text><text x="620" y="1340.125" font-size="25" text-anchor="middle">248,320 × 4,096</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,1279 L620,1157"/><text x="170" y="778" font-size="23" text-anchor="middle">Layer schedule</text><text x="170" y="804.91" font-size="23" text-anchor="middle">L → L → L → F</text><text x="170" y="831.82" font-size="23" text-anchor="middle">8 cycles</text><text x="170" y="862" font-size="22" text-anchor="middle">24 linear layers</text><text x="170" y="887.74" font-size="22" text-anchor="middle">8 full-attention layers</text><text x="1022" y="1015" font-size="23" text-anchor="middle">GQA: 16 Q / 4 KV</text><text x="1022" y="1041.91" font-size="23" text-anchor="middle">head width 256</text><text x="1022" y="1125" font-size="22" text-anchor="middle">Linear heads:</text><text x="1022" y="1150.74" font-size="22" text-anchor="middle">16 Q,K / 32 V</text><text x="1022" y="1176.48" font-size="22" text-anchor="middle">width 128</text><text x="620" y="1412" font-size="25" text-anchor="middle">Typed state prefix + isolated question blocks</text><text x="620" y="1441.25" font-size="25" text-anchor="middle">input limit 16,384 tokens</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M620,1382 L620,1355"/><text x="620" y="1510" class="serif" font-size="31" text-anchor="middle">Vela 2.0 9B</text><text x="620" y="1547" font-size="21" text-anchor="middle">Causal tree execution; the state prefix is reused per layer. Head computations use FP32.</text></svg>