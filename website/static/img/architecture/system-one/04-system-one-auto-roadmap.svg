<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1280" role="img" viewBox="0 0 1740 1280"><title>System One auto: composable decision-model backends</title><desc>Roadmap, not an implemented route. Model choice and replica choice are different stages.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="50" y="48" class="serif" font-size="30" text-anchor="start">(d) System One auto: route to intelligence</text><text x="50" y="82" font-size="21" text-anchor="start">ROADMAP · proposed extension of the same frontend and recipe architecture</text><rect width="460" height="294" x="75" y="155" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="99" y="195" font-size="29" text-anchor="start">Local decision-model deployment</text><g data-box="110.0 235 390 77"><rect width="390" height="77" x="110" y="235" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="305" y="267.865" font-size="23" text-anchor="middle">Replica 0 Replica 1 …</text><text x="305" y="294.775" font-size="23" text-anchor="middle">managed GPU workers</text></g><g data-box="110.0 353 390 62"><rect width="390" height="62" x="110" y="353" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="305" y="391.82" font-size="23" text-anchor="middle">Compatible-replica dispatch</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M305,353 L305,312"/><rect width="460" height="294" x="640" y="155" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="664" y="195" font-size="29" text-anchor="start">Independent vLLM-SR service</text><g data-box="675.0 235 390 77"><rect width="390" height="77" x="675" y="235" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="870" y="267.865" font-size="23" text-anchor="middle">Serving Engine + replica pools</text><text x="870" y="294.775" font-size="23" text-anchor="middle">local or attached workers</text></g><g data-box="675.0 353 390 62"><rect width="390" height="62" x="675" y="353" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="870" y="391.82" font-size="23" text-anchor="middle">System One frontend</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M870,353 L870,312"/><rect width="460" height="294" x="1205" y="155" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="1229" y="195" font-size="29" text-anchor="start">External decision provider</text><g data-box="1240.0 235 390 77"><rect width="390" height="77" x="1240" y="235" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1435" y="268.11" font-size="22" text-anchor="middle">Provider-managed inference</text><text x="1435" y="293.85" font-size="22" text-anchor="middle">placement owned by provider</text></g><g data-box="1240.0 353 390 62"><rect width="390" height="62" x="1240" y="353" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="1435" y="391.82" font-size="23" text-anchor="middle">Native provider adapter</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1435,353 L1435,312"/><rect width="1220" height="207" x="260" y="650" fill="#FFF" stroke="#111" stroke-dasharray="9 7" stroke-width="2.2" rx="12"/><text x="284" y="690" font-size="29" text-anchor="start">Decision Engine · routing recipe</text><g data-box="300.0 739 330 77"><rect width="330" height="77" x="300" y="739" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="465" y="771.865" font-size="23" text-anchor="middle">Signals + projections</text><text x="465" y="798.775" font-size="23" text-anchor="middle">request requirements</text></g><g data-box="705.0 739 330 77"><rect width="330" height="77" x="705" y="739" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="870" y="771.865" font-size="23" text-anchor="middle">Decision matching</text><text x="870" y="798.775" font-size="23" text-anchor="middle">conditions + policy</text></g><g data-box="1110.0 739 330 77"><rect width="330" height="77" x="1110" y="739" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1275" y="771.865" font-size="23" text-anchor="middle">Selection algorithm</text><text x="1275" y="798.775" font-size="23" text-anchor="middle">choose decision model</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M630,777 L705,777"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1035,777 L1110,777"/><path fill="none" stroke="#111" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1275,739 L1275,555 L305,555 L305,449"/><path fill="none" stroke="#111" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M870,555 L870,449"/><path fill="none" stroke="#111" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1275,555 L1435,555 L1435,449"/><circle cx="870" cy="555" r="3.5" fill="#111"/><circle cx="1275" cy="555" r="3.5" fill="#111"/><text x="870" y="600" font-size="22" text-anchor="middle">Model selection → one compatible backend</text><g data-box="405.0 943 930 94"><rect width="930" height="94" x="405" y="943" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="870" y="984.12" font-size="24" text-anchor="middle">Frontend · System One codec + access checks</text><text x="870" y="1012.2" font-size="24" text-anchor="middle">model: vllm-sr/auto → resolved entrypoint and recipe</text></g><path fill="none" stroke="#111" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M870,943 L870,900 L465,900 L465,816"/><g data-box="535.0 1106 670 64"><rect width="670" height="64" x="535" y="1106" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="870" y="1146.5" font-size="25" text-anchor="middle">Application: state + typed questions</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M870,1106 L870,1037"/><text x="870" y="1210" font-size="21" text-anchor="middle">Dashed arrows: future routed-native path. Current native calls address a concrete served model.</text><text x="870" y="1243" font-size="21" text-anchor="middle">The selected model may have several replicas. Replica dispatch stays inside its deployment.</text></svg>