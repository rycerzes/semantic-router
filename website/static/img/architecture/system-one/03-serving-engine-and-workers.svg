<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1410" role="img" viewBox="0 0 1810 1410"><title>Serving Engine: replica pools and modular workers</title><desc>Deployment-level dispatch, worker ownership and pluggable inference internals.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="50" y="48" class="serif" font-size="30" text-anchor="start">(c) Scale deployments; compose inference inside each worker</text><text x="50" y="82" font-size="21" text-anchor="start">Current implementation · replica selection is separate from choosing a model</text><rect width="970" height="1030" x="65" y="135" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="89" y="175" font-size="29" text-anchor="start">Deployment and replica layer</text><g data-box="135.0 1000 830 100"><rect width="830" height="100" x="135" y="1000" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="550" y="1044.12" font-size="24" text-anchor="middle">Deployment binding + current generation</text><text x="550" y="1072.2" font-size="24" text-anchor="middle">model identity, capabilities, placement and readiness</text></g><g data-box="140.0 795 390 128"><rect width="390" height="128" x="140" y="795" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="335" y="840.74" font-size="22" text-anchor="middle">Deployment A pool</text><text x="335" y="866.48" font-size="22" text-anchor="middle">same model + revision + engine args</text><text x="335" y="892.22" font-size="22" text-anchor="middle">bounded admission</text></g><g data-box="575.0 795 390 128"><rect width="390" height="128" x="575" y="795" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="770" y="840.74" font-size="22" text-anchor="middle">Deployment B pool</text><text x="770" y="866.48" font-size="22" text-anchor="middle">separate model identity</text><text x="770" y="892.22" font-size="22" text-anchor="middle">bounded admission</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M550,1000 L550,965 L335,965 L335,923"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M550,965 L770,965 L770,923"/><circle cx="550" cy="965" r="3.5" fill="#111"/><g data-box="105.0 560 410 138"><rect width="410" height="138" x="105" y="560" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="310" y="609.08" font-size="24" text-anchor="middle">Managed worker replicas</text><text x="310" y="637.16" font-size="24" text-anchor="middle">GPU 0 GPU 1 …</text><text x="310" y="665.24" font-size="24" text-anchor="middle">local process supervision</text></g><g data-box="580.0 560 410 138"><rect width="410" height="138" x="580" y="560" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="785" y="609.91" font-size="23" text-anchor="middle">Attached runtime replicas</text><text x="785" y="636.82" font-size="23" text-anchor="middle">remote endpoint 1 …</text><text x="785" y="663.73" font-size="23" text-anchor="middle">operated independently</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M335,795 L335,698"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M770,795 L770,698"/><text x="550" y="747" font-size="22" text-anchor="middle">Replica selection</text><g data-box="135.0 322 830 140"><rect width="830" height="140" x="135" y="322" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="550" y="372.08" font-size="24" text-anchor="middle">Dispatch policy</text><text x="550" y="400.16" font-size="24" text-anchor="middle">Least outstanding request bytes</text><text x="550" y="428.24" font-size="24" text-anchor="middle">tie: least recently assigned ready worker</text></g><text x="550" y="244" font-size="23" text-anchor="middle">Pool policy · applies independently to each deployment</text><text x="550" y="506" font-size="21" text-anchor="middle">32 HTTP requests in flight per worker; no pool waiting queue.</text><text x="550" y="1137" font-size="21" text-anchor="middle">Generation leases preserve in-flight work during replacement.</text><rect width="630" height="1030" x="1115" y="135" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="1139" y="175" font-size="29" text-anchor="start">Inside one vllm-srun worker</text><g data-box="1170.0 235 520 75"><rect width="520" height="75" x="1170" y="235" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="280.32" font-size="23" text-anchor="middle">Typed answers / embeddings / ranks</text></g><g data-box="1170.0 377 520 82"><rect width="520" height="82" x="1170" y="377" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="412.61" font-size="22" text-anchor="middle">Family-specific answer construction</text><text x="1430" y="438.35" font-size="22" text-anchor="middle">probabilities, spans, vectors or scores</text></g><g data-box="1170.0 523 520 82"><rect width="520" height="82" x="1170" y="523" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="558.61" font-size="22" text-anchor="middle">Execution engine + accelerator</text><text x="1430" y="584.35" font-size="22" text-anchor="middle">network execution on CPU / CUDA / ROCm</text></g><g data-box="1170.0 675 520 82"><rect width="520" height="82" x="1170" y="675" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="710.365" font-size="23" text-anchor="middle">Batch planning</text><text x="1430" y="737.275" font-size="23" text-anchor="middle">engine args: batching, shared context</text></g><g data-box="1170.0 825 520 84"><rect width="520" height="84" x="1170" y="825" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="861.365" font-size="23" text-anchor="middle">Model-family adapter</text><text x="1430" y="888.275" font-size="23" text-anchor="middle">validate input, prepare work items</text></g><g data-box="1170.0 1000 520 100"><rect width="520" height="100" x="1170" y="1000" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="1430" y="1044.365" font-size="23" text-anchor="middle">Worker API / runtime bundle</text><text x="1430" y="1071.275" font-size="23" text-anchor="middle">model card, input contract, deadlines</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,1000 L1430,909"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,825 L1430,757"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,675 L1430,605"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,523 L1430,459"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1430,377 L1430,310"/><path fill="none" stroke="#111" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M515,628 L545,628 L545,535 L1072,535 L1072,192 L1115,192"/><text x="980" y="214" font-size="20" text-anchor="end">Expanded view</text><g data-box="185.0 1225 780 76"><rect width="780" height="76" x="185" y="1225" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="575" y="1271.5" font-size="25" text-anchor="middle">Native frontend or model-backed routing tasks</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M550,1225 L550,1165"/><text x="1430" y="1239" font-size="23" text-anchor="middle">Pluggable runtime interfaces</text><text x="1430" y="1265.91" font-size="23" text-anchor="middle">Family · engine · accelerator</text><text x="905" y="1347" font-size="22" text-anchor="middle">DP replicates the model. Placing each replica on its own GPU is supported; TP / PP are follow-up work.</text><text x="905" y="1380" font-size="20" text-anchor="middle">HTTP in-flight counters are not GPU-forward concurrency. Some active forwards continue after caller cancellation.</text></svg>