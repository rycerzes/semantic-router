<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1100" role="img" viewBox="0 0 1550 1100"><title>Composable vLLM Semantic Router</title><desc>Current native frontend composition; logical components and optional routing.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="50" y="48" class="serif" font-size="30" text-anchor="start">(a) One frontend, composable intelligence</text><text x="50" y="82" font-size="21" text-anchor="start">Current implementation · logical components, not mandatory process boundaries</text><rect width="660" height="112" x="110" y="142" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="134" y="182" font-size="29" text-anchor="start">Answering backends</text><text x="440" y="223" font-size="24" text-anchor="middle">vLLM / private services / hosted APIs</text><rect width="660" height="322" x="110" y="320" fill="#FFF" stroke="#111" stroke-dasharray="9 7" stroke-width="2.2" rx="12"/><text x="134" y="360" font-size="29" text-anchor="start">Decision Engine · optional</text><text x="440" y="396" font-size="23" text-anchor="middle">Enabled routing policy and recipes</text><g data-box="148.0 435 280 78"><rect width="280" height="78" x="148" y="435" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="288" y="468.12" font-size="24" text-anchor="middle">Decisions</text><text x="288" y="496.2" font-size="24" text-anchor="middle">+ selection algorithm</text></g><g data-box="452.0 435 280 78"><rect width="280" height="78" x="452" y="435" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="592" y="468.365" font-size="23" text-anchor="middle">Request / response</text><text x="592" y="495.275" font-size="23" text-anchor="middle">plugin hooks</text></g><g data-box="148.0 545 584 64"><rect width="584" height="64" x="148" y="545" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="440" y="585.5" font-size="25" text-anchor="middle">Signals + projections</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M287,545 L287,513"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M440,320 L440,254"/><text x="467" y="293" font-size="20" text-anchor="start">Selected Chat backend</text><rect width="500" height="500" x="940" y="142" fill="#FFF" stroke="#111" stroke-dasharray="9 7" stroke-width="2.2" rx="12"/><text x="964" y="182" font-size="29" text-anchor="start">Serving Engine · Model Runtime</text><text x="1190" y="216" font-size="20" text-anchor="middle">Loaded for native APIs / model-backed tasks</text><text x="1190" y="245" font-size="20" text-anchor="middle">Worker outputs: answers / vectors / ranks</text><g data-box="972.0 266 436 76"><rect width="436" height="76" x="972" y="266" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1190" y="298.365" font-size="23" text-anchor="middle">Managed workers</text><text x="1190" y="325.275" font-size="23" text-anchor="middle">or attached runtime endpoints</text></g><g data-box="972.0 384 436 76"><rect width="436" height="76" x="972" y="384" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1190" y="416.365" font-size="23" text-anchor="middle">One pool per deployment</text><text x="1190" y="443.275" font-size="23" text-anchor="middle">compatible replicas</text></g><g data-box="972.0 508 436 92"><rect width="436" height="92" x="972" y="508" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1190" y="548.365" font-size="23" text-anchor="middle">Native APIs + task adapters</text><text x="1190" y="575.275" font-size="23" text-anchor="middle">capability and input validation</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1190,508 L1190,460"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1190,384 L1190,342"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M770,577 L940,577"/><text x="855" y="516" font-size="20" text-anchor="middle">Model-backed</text><text x="855" y="539.4" font-size="20" text-anchor="middle">tasks, when used</text><rect width="1330" height="198" x="110" y="727" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="134" y="767" font-size="29" text-anchor="start">Frontend · shared across modes</text><text x="136" y="801" font-size="23" text-anchor="start">Listener access + model grants + protocol adapters</text><g data-box="143.0 830 374 65"><rect width="374" height="65" x="143" y="830" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="330" y="871" font-size="25" text-anchor="middle">Chat Completions</text></g><g data-box="588.0 830 374 65"><rect width="374" height="65" x="588" y="830" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="775" y="871" font-size="25" text-anchor="middle">Responses</text></g><g data-box="1033.0 830 374 65"><rect width="374" height="65" x="1033" y="830" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="1220" y="871" font-size="25" text-anchor="middle">System One</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M440,727 L440,642"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1190,727 L1190,642"/><text x="455" y="689" font-size="21" text-anchor="start">Routed requests</text><text x="1205" y="689" font-size="21" text-anchor="start">Direct native requests</text><g data-box="345.0 983 860 64"><rect width="860" height="64" x="345" y="983" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="775" y="1023.5" font-size="25" text-anchor="middle">Applications and agents</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M775,983 L775,925"/><text x="775" y="1077" font-size="20" text-anchor="middle">Dashed boundary: optional component. Models load only for active deployments.</text></svg>