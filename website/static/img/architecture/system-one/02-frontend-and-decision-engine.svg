<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1370" role="img" viewBox="0 0 1900 1370"><title>Frontend and optional Decision Engine</title><desc>Chat and native recipe routing, concrete native bypass and shared typed task execution.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#111" d="M0 0 L12 5 L0 10 L3 5 Z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.serif{font-family:Georgia,&apos;Times New Roman&apos;,serif}</style><text x="50" y="48" class="serif" font-size="30" text-anchor="start">(b) Protocols, routing policy and shared tasks</text><text x="50" y="82" font-size="21" text-anchor="start">Request processing is shown bottom → top. Return streams use the corresponding codec.</text><g data-box="190.0 125 660 75"><rect width="660" height="75" x="190" y="125" fill="#D8EBD8" stroke="#111" stroke-width="2.2" rx="7"/><text x="520" y="156.62" font-size="24" text-anchor="middle">Backend exchange</text><text x="520" y="184.7" font-size="24" text-anchor="middle">selected model or configured orchestration</text></g><rect width="790" height="742" x="125" y="255" fill="#FFF" stroke="#111" stroke-dasharray="9 7" stroke-width="2.2" rx="12"/><text x="149" y="295" font-size="29" text-anchor="start">Decision Engine</text><text x="800" y="295" font-size="20" text-anchor="middle">Recipe-scoped</text><g data-box="200.0 332 580 70"><rect width="580" height="70" x="200" y="332" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="490" y="361.12" font-size="24" text-anchor="middle">Selection algorithm</text><text x="490" y="389.2" font-size="24" text-anchor="middle">choose / cascade / combine</text></g><g data-box="200.0 460 580 70"><rect width="580" height="70" x="200" y="460" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="490" y="489.12" font-size="24" text-anchor="middle">Decision matching</text><text x="490" y="517.2" font-size="24" text-anchor="middle">conditions + strategy</text></g><g data-box="200.0 588 580 62"><rect width="580" height="62" x="200" y="588" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="490" y="627.16" font-size="24" text-anchor="middle">Projection evaluation</text></g><g data-box="200.0 708 580 70"><rect width="580" height="70" x="200" y="708" fill="#FCE1B8" stroke="#111" stroke-width="2.2" rx="7"/><text x="490" y="737.12" font-size="24" text-anchor="middle">Signal evaluation</text><text x="490" y="765.2" font-size="24" text-anchor="middle">rules and model-backed judgments</text></g><g data-box="200.0 856 580 82"><rect width="580" height="82" x="200" y="856" fill="#E6ECE8" stroke="#111" stroke-width="2.2" rx="7"/><text x="490" y="891.12" font-size="24" text-anchor="middle">Entrypoint → isolated recipe</text><text x="490" y="919.2" font-size="24" text-anchor="middle">defaults resolved before execution</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,856 L490,778"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,708 L490,650"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,588 L490,530"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,460 L490,402"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,332 L490,200"/><text x="515" y="971" font-size="20" text-anchor="middle">Chat plugins attach to request, stream and response phases.</text><rect width="540" height="655" x="1070" y="330" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="1094" y="370" font-size="29" text-anchor="start">Shared task execution</text><g data-box="1105.0 418 470 75"><rect width="470" height="75" x="1105" y="418" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1340" y="449.865" font-size="23" text-anchor="middle">Bound deployment invocation</text><text x="1340" y="476.775" font-size="23" text-anchor="middle">same model pool as native calls</text></g><g data-box="1105.0 546 470 84"><rect width="470" height="84" x="1105" y="546" fill="#DEDCEE" stroke="#111" stroke-width="2.2" rx="7"/><text x="1340" y="570.57" font-size="21" text-anchor="middle">Binding + capability resolution</text><text x="1340" y="595.14" font-size="21" text-anchor="middle">recipe → global binding</text><text x="1340" y="619.71" font-size="21" text-anchor="middle">→ module / default model</text></g><g data-box="1105.0 684 470 84"><rect width="470" height="84" x="1105" y="684" fill="#FBF8CB" stroke="#111" stroke-width="2.2" rx="7"/><text x="1340" y="720.365" font-size="23" text-anchor="middle">Typed task contract</text><text x="1340" y="747.275" font-size="23" text-anchor="middle">coverage + output + error policy</text></g><g data-box="1105.0 830 470 84"><rect width="470" height="84" x="1105" y="830" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1340" y="866.61" font-size="22" text-anchor="middle">Task registry and input adapters</text><text x="1340" y="892.35" font-size="22" text-anchor="middle">shared Router / Playground templates</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1340,830 L1340,768"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1340,684 L1340,630"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1340,546 L1340,493"/><g data-box="1090.0 125 490 75"><rect width="490" height="75" x="1090" y="125" fill="#C7E5F0" stroke="#111" stroke-width="2.2" rx="7"/><text x="1335" y="170.66" font-size="24" text-anchor="middle">Serving Engine / deployment pools</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1340,418 L1340,398 L1635,398 L1635,235 L1340,235 L1340,200"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M780,743 L993,743 L993,872 L1105,872"/><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M780,367 L993,367 L993,743"/><circle cx="993" cy="743" r="3.5" fill="#111"/><text x="992" y="1020" font-size="21" text-anchor="middle">Model-backed work only</text><rect width="1485" height="170" x="125" y="1100" fill="#FFF" stroke="#111" stroke-width="2.2" rx="12"/><text x="149" y="1140" font-size="29" text-anchor="start">Frontend: access checks, protocol codecs and dispatch</text><g data-box="160.0 1180 560 62"><rect width="560" height="62" x="160" y="1180" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="440" y="1219.16" font-size="24" text-anchor="middle">Chat Completions / Responses</text></g><g data-box="1065.0 1180 510 62"><rect width="510" height="62" x="1065" y="1180" fill="#F7DCDF" stroke="#111" stroke-width="2.2" rx="7"/><text x="1320" y="1219.16" font-size="24" text-anchor="middle">System One: state + questions</text></g><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M490,1100 L490,997"/><text x="510" y="1053" font-size="21" text-anchor="start">Chat entrypoint</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M1320,1100 L1320,1075 L490,1075"/><circle cx="490" cy="1075" r="3.5" fill="#111"/><text x="1030" y="1053" font-size="21" text-anchor="middle">Native entrypoint</text><path fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#arrow)" d="M1510,1100 L1830,1100 L1830,163 L1580,163"/><text x="1725" y="610" font-size="21" text-anchor="middle">Concrete model</text><text x="1725" y="634.57" font-size="21" text-anchor="middle">bypass</text><text x="1725" y="684" font-size="20" text-anchor="middle">No routing</text><text x="1725" y="707.4" font-size="20" text-anchor="middle">recipe</text><text x="868" y="1314" font-size="21" text-anchor="middle">System One auto uses an explicit native entrypoint and recipe to coordinate decision-model backends.</text><text x="868" y="1348" font-size="20" text-anchor="middle">Concrete native model IDs bypass routing. Native recipes use bounded cascades and typed acceptance.</text></svg>